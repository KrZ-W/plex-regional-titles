[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plex-regional-titles"
version = "1.2.0"
description = "Set Plex library item titles to the regional release title and lock them."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "KrZ-W" }]
dependencies = [
    "PlexAPI>=4.15,<5",
    "requests>=2.31,<3",
    "PyYAML>=6,<7",
    "croniter>=2,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
plex-regional-titles = "plex_regional_titles.cli:main"

[project.entry-points."plex_regional_titles.registries"]
regie = "plex_regional_titles.sources.regie:RegieDuCinemaRegistry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
